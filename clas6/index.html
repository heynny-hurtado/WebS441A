<script src="./BD/employees.js"></script>
<script src="./js/Materias-list.js"></script>
<script>
    const MateriasComponentSlot =
        document.getElementById('Materias-component-slot');

    async function loadMateriasComponent() {

        try {

            const response =
                await fetch('./componentes/materias-list.html');

            if (!response.ok) {
                throw new Error("No fue posible cargar el componente de materias.");
            }

            MateriasComponentSlot.innerHTML = await response.text();

        } catch (error) {

            console.error(error);
            MateriasComponentSlot.innerHTML = '<p>Error al cargar el componente de materias.</p>';
        }

    }

    loadMateriasComponent();

</script>
